name: edged
description: Edged — Your private, offline on-device AI assistant for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.2
  dio: ^5.7.0
  file_picker: ^10.3.10
  image_picker: ^1.1.2
  archive: ^3.6.1
  xml: ^6.5.0
  syncfusion_flutter_pdf: ^27.2.5
  device_info_plus: ^11.1.1
  battery_plus: ^6.2.1
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  intl: ^0.19.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
