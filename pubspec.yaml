name: edged
description: Edged — Your private, offline on-device AI assistant for Android and iOS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^11.2.0
  dio: ^5.7.0
  file_picker: ^13.4.0
  image_picker: ^1.1.2
  archive: ^4.7.1
  xml: ^7.1.0
  syncfusion_flutter_pdf: ^35.2.12
  device_info_plus: ^13.3.0
  battery_plus: ^7.1.2
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  intl: ^0.20.3
  google_fonts: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
